<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Reinklang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/symbol.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div id="harmony-keyboard"></div>

  <!-- L8, Z12.2: Überschrift, gewählter Name und Listenzeichen; darüber die unsichtbare Auswahlliste, ein Tipp
       öffnet die Auswahl des Browsers. Den Namen setzt main.js. -->
  <div id="instrument" class="sound-control-group">
    <span class="picker-label"><small class="cap">Instrument</small><span class="val"></span><span class="arrow">▾</span></span>
    <select id="instrument-select" aria-label="Instrument">
    </select>
  </div>
  <div id="tuning" class="sound-control-group">
    <span class="picker-label"><small class="cap">Stimmung</small><span class="val"></span><span class="arrow">▾</span></span>
    <select id="tuning-select" aria-label="Stimmung">
    </select>
  </div>

  <div id="pitch" class="tone-input-group">
    <input type="number" id="tone-input">
    <span id="hz-unit">Hz</span>
    <div class="step-control">
      <button id="btn-pitch-up">▲</button>
      <button id="btn-pitch-down">▼</button>
    </div>
  </div>
  <div class="sustain-release-half" id="btn-sustain">Sustain</div>
  <div class="sustain-release-half" id="btn-release">Release</div>

  <button id="fullscreen-toggle" type="button" title="Vollbild">⛶</button>

  <div id="transpose" class="transpose-group">
    <button id="btn-trans-down" class="tone-btn">↓</button>
    <div class="transpose-label">
      <span>Transp.</span>
      <span id="trans-val"></span>
    </div>
    <button id="btn-trans-up" class="tone-btn">↑</button>
  </div>

  <div id="keyboard-tools">
    <button type="button" data-action="octDown">&lt;&lt;</button>
    <button type="button" data-action="semiDown">&lt;</button>
    <button type="button" data-action="semiUp">&gt;</button>
    <button type="button" data-action="octUp">&gt;&gt;</button>
    <!-- Z9: kleines Klaviatur-Zeichen und −/+ für die Tastenanzahl. -->
    <button type="button" data-action="decKeys"><span class="mini-keys"></span>−</button>
    <button type="button" data-action="incKeys"><span class="mini-keys"></span>+</button>
  </div>

  <!-- Z3.4: Anpass-Feld beim Stimmung-Anpassen, überdeckt Tastenbereich, Transposition und Stimmton. -->
  <div id="tuning-editor" hidden>
    <p class="tuning-editor-hint">Haus antippen, um seinen Ton zu ändern</p>
    <button id="tuning-editor-done" type="button">Fertig</button>
  </div>
  <!-- Z3.4: Intervall-Liste für den gewählten Grad, überdeckt Harmonieklaviatur, Instrument, Stimmung und das
       Anpass-Feld; rechts ein ausgegrauter Streifen mit ✕, ✓ und dem Cent-Feld. Die Einträge setzt tuningeditor.js. -->
  <div id="interval-list" hidden></div>
  <div id="interval-strip" hidden>
    <div class="interval-buttons">
      <button id="interval-close" type="button" title="Änderung zurücknehmen">✕</button>
      <button id="interval-accept" type="button" title="Änderung übernehmen">✓</button>
    </div>
    <span id="interval-degree"></span>
    <input type="number" id="interval-cents" step="0.01" aria-label="Cent">
    <span class="interval-unit">ct</span>
  </div>

  <div id="keyboard"></div>
</div>

<script src="js/diagnose.js"></script>
<script type="module" src="js/main.js"></script>
