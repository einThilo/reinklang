<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinklang – Entwürfe</title>
<style>
  body { margin: 0; padding: 16px; background: #444; font-family: sans-serif; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; font-size: 14px; color: #ccc; max-width: 70em; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  nav a { padding: 6px 10px; border-radius: 6px; background: #2a2a2a; color: #8fd; text-decoration: none; font-size: 14px; }
  nav a.current { background: #8fd; color: #111; }
  #gallery { display: flex; flex-wrap: wrap; gap: 20px; }
  .card { background: #2a2a2a; border-radius: 10px; padding: 10px; width: var(--w); }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .card .desc { font-size: 13px; color: #bbb; margin: 0 0 8px; min-height: 2.6em; }
  .frame { width: var(--w); height: calc(var(--w) * 360 / 800); overflow: hidden; }
  .frame iframe {
    width: 800px; height: 360px; border: 0; display: block;
    transform: scale(var(--s)); transform-origin: 0 0;
  }
  .card .links { margin-top: 8px; display: flex; gap: 14px; font-size: 14px; }
  .card .links a { color: #8fd; cursor: pointer; }
  #single, #single iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<h1>Entwürfe zum Vergleichen</h1>
<p>Die echte App im Layout block4, je Rahmen ein Entwurf. Ton nur aus dem zuletzt berührten Rahmen. „groß öffnen“
zeigt einen Entwurf allein (auch am Handy über Tailscale). Nur Aussehen: Die App selbst bleibt unverändert.<br>
<label><input type="checkbox" id="sync" checked> Berührungen in allen Rahmen gleichzeitig</label></p>
<nav id="topics"></nav>
<p id="topic-desc"></p>
<div id="gallery"></div>

<script>
/* ============================================================
   Gemeinsame Bausteine (laufen im Rahmen; `doc`, `win` sind dessen document und window)
   ============================================================ */

// Liste zeigt den gewählten Namen (Z12.2): Überschrift klein, Name groß, Listenzeichen.
function showChosenName(doc) {
  for (const group of doc.querySelectorAll(".sound-control-group")) {
    const label = group.querySelector(".picker-label");
    const select = group.querySelector("select");
    const caption = label.textContent;
    label.innerHTML = `<small class="cap"></small><span class="val"></span><span class="arrow">▾</span>`;
    label.querySelector(".cap").textContent = caption;
    const update = () => { label.querySelector(".val").textContent = select.selectedOptions[0]?.textContent ?? ""; };
    select.addEventListener("change", update);
    update();
  }
}

// Am <body> die Klasse „tuning-off“, solange das Tuning aus ist (erkannt an „Stimmung aus“ in der Lücke).
function markTuningOff(doc, win) {
  const middle = doc.querySelector('#harmony-keyboard .special[data-special="middle"]');
  const update = () => doc.body.classList.toggle("tuning-off", middle.classList.contains("hidden"));
  new win.MutationObserver(update).observe(middle, { attributes: true });
  update();
}

// Hz-Einheit neben dem Zahlenfeld (W3), als eigenes Element in derselben Zelle.
function addHzUnit(doc) {
  const unit = doc.createElement("span");
  unit.id = "hz-unit";
  unit.textContent = "Hz";
  doc.getElementById("tone-input").after(unit);
}

// Beschriftungen tauschen: { "#selector": "Text oder HTML" }.
function relabel(doc, labels) {
  for (const [selector, html] of Object.entries(labels)) {
    const element = doc.querySelector(selector);
    if (element) element.innerHTML = html;
  }
}

// Startfläche umbauen (Z21): Logo, Aufforderung, Erklärung; die Versionsnummer bleibt.
function rebuildOverlay(doc, { logo, title, texts, layout }) {
  const overlay = doc.getElementById("start-overlay");
  if (!overlay) return;
  const version = doc.getElementById("start-version");
  overlay.textContent = "";
  overlay.classList.add("z21", layout);
  const box = doc.createElement("div");
  box.className = "z21-box";
  box.innerHTML = `
    ${logo ? `<img class="z21-logo" src="icons/symbol.svg" alt="">` : ""}
    ${title ? `<div class="z21-title">Reinklang</div>` : ""}
    <div class="z21-tap">Tippen zum Starten</div>
    <ul class="z21-texts">${texts.map(text => `<li>${text}</li>`).join("")}</ul>`;
  overlay.appendChild(box);
  if (version) overlay.appendChild(version);
}

// Hinweise direkt an den Bereichen (Z21, Variante mit Markierungen).
function overlayHints(doc, hints) {
  const overlay = doc.getElementById("start-overlay");
  if (!overlay) return;
  for (const { selector, text } of hints) {
    const target = doc.querySelector(selector);
    if (!target) continue;
    const r = target.getBoundingClientRect();
    const hint = doc.createElement("div");
    hint.className = "z21-hint";
    hint.style.left = r.left + "px";
    hint.style.top = r.top + "px";
    hint.style.width = r.width + "px";
    hint.style.height = r.height + "px";
    hint.innerHTML = `<span>${text}</span>`;
    overlay.appendChild(hint);
  }
}

/* ============================================================
   Themen und Entwürfe
   Jeder Entwurf: Name, Beschreibung, CSS (gilt unter body#design) und optional Code im Rahmen.
   ============================================================ */

const P = "body#design.layout-block4";   // Vorsilbe, damit die Regeln die aus style.css übertreffen

${P} .picker-label .val { grid-area: 2 / 1 / 3 / 2; color: #eee; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
${P} .picker-label .arrow { grid-area: 1 / 2 / 3 / 3; color: var(--c); margin-left: 6px; }
${P}.tuning-off #tuning .picker-label { --c: #777; }
${P}.tuning-off #tuning .picker-label .val { color: #888; }`;
}

// „⇤ tief“ und „1. erst“ mit Wort darunter (Z12.3).

// Zweizeilige Beschriftung der +/−-Knöpfe (Z9).

${P} :is(#keyboard-tools button, #pitch button) small { font-size: max(9px, 0.5em); font-weight: normal; opacity: 0.85; }`;

// Gemeinsames CSS der Startflächen (Z21).
const START_BASE = `

        css: PM_BASE,

/* ============================================================
   Rahmen, Ton und gespiegelte Berührungen (wie design.html)
   ============================================================ */

const APP_URL = "../index.html?layout=block4";
const NO_OVERLAY = `#start-overlay { display: none !important; }`;
const frames = [];

const params = new URLSearchParams(location.search);
const topicId = TOPICS[params.get("thema")] ? params.get("thema") : Object.keys(TOPICS)[0];
const topic = TOPICS[topicId];
const single = params.get("v");

function inject(iframe, variant, withOverlay) {
  const doc = iframe.contentDocument;
  const win = iframe.contentWindow;
  doc.body.id = "design";
  const style = doc.createElement("style");
  style.textContent = (withOverlay ? "" : `body#design ${NO_OVERLAY}`) + variant.css;
  doc.head.appendChild(style);
  // Erst nach dem Start der App (DOMContentLoaded ist vorbei, die Startfläche liegt schon da).
  if (variant.run) variant.run(doc, win);
}

if (single && topic.variants[single]) {
  const variant = topic.variants[single];
  document.body.innerHTML = `<div id="single"><iframe src="${APP_URL}" allow="fullscreen; autoplay"></iframe></div>`;
  document.title = `Reinklang – ${topic.name}: ${variant.name}`;
  const iframe = document.querySelector("#single iframe");
  iframe.addEventListener("load", () => inject(iframe, variant, true));
} else {
  const nav = document.getElementById("topics");
  for (const [id, t] of Object.entries(TOPICS)) {
    const link = document.createElement("a");
    link.href = `?thema=${id}`;
    link.textContent = t.name;
    if (id === topicId) link.className = "current";
    nav.appendChild(link);
  }
  document.getElementById("topic-desc").textContent = topic.desc;
  const width = Math.min(480, document.documentElement.clientWidth - 52);
  const gallery = document.getElementById("gallery");
  gallery.style.setProperty("--w", width + "px");
  gallery.style.setProperty("--s", width / 800);
  if (topic.overlay) document.getElementById("sync").checked = false;
  for (const [id, variant] of Object.entries(topic.variants)) buildCard(gallery, id, variant);
}

function buildCard(gallery, id, variant) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${id} ${variant.name}</h2><div class="desc">${variant.desc}</div>
    <div class="frame"><iframe src="${APP_URL}"></iframe></div>
    <div class="links"><a target="_blank" href="?thema=${topicId}&v=${id}">groß öffnen</a><a class="reload">neu laden</a></div>`;
  gallery.appendChild(card);

  const iframe = card.querySelector("iframe");
  card.querySelector(".reload").addEventListener("click", () => iframe.contentWindow.location.reload());
  iframe.addEventListener("load", () => {
    inject(iframe, variant, topic.overlay);
    gateAudio(iframe);
    mirror(iframe);
  });
  frames.push(iframe);
}

// Ton nur aus dem zuletzt berührten Rahmen.
let activeFrame = null;
const gates = new Map();

function gateAudio(frame) {
  const win = frame.contentWindow;
  const connect = win.AudioNode.prototype.connect;
  win.AudioNode.prototype.connect = function (target, ...rest) {
    if (target instanceof win.AudioDestinationNode) {
      let gate = gates.get(frame);
      if (!gate) {
        gate = target.context.createGain();
        gate.gain.value = frame === activeFrame ? 1 : 0;
        connect.call(gate, target);
        gates.set(frame, gate);
      }
      return connect.call(this, gate, ...rest);
    }
    return connect.call(this, target, ...rest);
  };
}

function setActiveFrame(frame) {
  activeFrame = frame;
  for (const [other, gate] of gates) gate.gain.value = other === frame ? 1 : 0;
}

// Jede echte Berührung in einem Rahmen wird in allen anderen an derselben Stelle nachgespielt.
function mirror(source) {
  for (const type of ["pointerdown", "pointermove", "pointerup", "pointercancel"]) {
    source.contentDocument.addEventListener(type, event => {
      if (!event.isTrusted) return;
      if (type === "pointerdown") setActiveFrame(source);
      if (!document.getElementById("sync").checked) return;
      for (const other of frames) if (other !== source) replay(other, event);
    }, true);
  }
}

const pressedTargets = new Map();

function replay(frame, event) {
  const doc = frame.contentDocument;
  if (!doc) return;
  if (!pressedTargets.has(frame)) pressedTargets.set(frame, new Map());
  const targets = pressedTargets.get(frame);
  let target = targets.get(event.pointerId);
  if (event.type === "pointerdown") {
    target = doc.elementFromPoint(event.clientX, event.clientY);
    if (target) targets.set(event.pointerId, target);
  }
  if (!target) return;
  if (event.type === "pointerup" || event.type === "pointercancel") targets.delete(event.pointerId);
  target.dispatchEvent(new frame.contentWindow.PointerEvent(event.type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: event.pointerId, pointerType: event.pointerType, isPrimary: event.isPrimary,
    clientX: event.clientX, clientY: event.clientY, screenX: event.screenX, screenY: event.screenY,
    button: event.button, buttons: event.buttons, width: event.width, height: event.height
  }));
}
</script>
